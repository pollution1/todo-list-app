<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待办事项清单</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="todo-wrapper">
            <!-- 标题 -->
            <h1 class="title">📋 待办事项清单</h1>
            
            <!-- 输入区域 -->
            <div class="input-section">
                <input 
                    type="text" 
                    id="todoInput" 
                    class="todo-input" 
                    placeholder="添加新的待办事项..."
                    autocomplete="off"
                >
                <button id="addBtn" class="add-btn">添加</button>
            </div>

            <!-- 过滤按钮 -->
            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">全部</button>
                <button class="filter-btn" data-filter="active">未完成</button>
                <button class="filter-btn" data-filter="completed">已完成</button>
            </div>

            <!-- 统计信息 -->
            <div class="stats">
                <span>总数: <span id="totalCount">0</span></span>
                <span>未完成: <span id="activeCount">0</span></span>
                <span>已完成: <span id="completedCount">0</span></span>
            </div>

            <!-- 待办事项列表 -->
            <ul id="todoList" class="todo-list">
                <!-- 动态生成的项目 -->
            </ul>

            <!-- 清空完成项按钮 -->
            <div class="action-section">
                <button id="clearCompleted" class="clear-btn">清空已完成项</button>
                <button id="exportBtn" class="export-btn">导出</button>
                <button id="importBtn" class="import-btn">导入</button>
                <input type="file" id="fileInput" accept=".json" style="display: none;">
            </div>

            <!-- 空状态 -->
            <div id="emptyState" class="empty-state">
                <p>🎉 太棒了！没有待办事项</p>
            </div>
        </div>
    </div>

    <script src="storage.js"></script>
    <script src="app.js"></script>
</body>
</html>
